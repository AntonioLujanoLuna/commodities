repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: no-committed-outputs
        name: outputs are generated, never committed
        entry: bash -c 'git diff --cached --name-only | grep -E "^(figures|tables|logs)/" && echo "figures/, tables/ and logs/ are build artefacts - run make clean" && exit 1 || exit 0'
        language: system
        pass_filenames: false
