# Outcome-independent exposure-weighted panel design. This does NOT alter the frozen
# primary event-study contract in commodities.yaml; it is a separate
# identification strategy for the same question.
#
# Why this exists
# ---------------
# The event study defines an abnormal return relative to a baseline estimated
# outside the union of every -12/+24 warm window. That baseline is a small,
# ENSO-selected residual of history, and the precious-metal negative controls
# reject under every control block the study has added so far. A calendar-month
# fixed effect removes that whole class of problem by construction: whatever
# global macro-financial regime lifts gold in a given month lifts the fixed
# effect too, so it cannot be attributed to ENSO.
#
# The price is that the ENSO level is absorbed along with everything else.
# Identification comes only from the cross-section: commodities differ in how
# exposed they are to the ENSO signal, so the coefficient below measures the
# differential response per unit of exposure relative to the same-month average
# across the estimation sample. It is not a level effect, and a common shock
# that moved every commodity identically would be invisible to it.
#
# Weight contract
# ---------------
# Version 2 is generated mechanically from external physical data: SPAM 2020
# crop area multiplied by the positive FAO ASIS drought-frequency difference
# between strong El Nino and baseline years. Commodity prices never enter the
# weight construction. Candidates without a defensible crop-area layer are
# excluded rather than assigned zero exposure.

exposure_provenance:
  version: 2
  method: external_crop_area_x_el_nino_drought_hotspot
  authored_on: 2026-09-06
  outcome_blind: true
  inference_scope: retrospective_external_validation

specification:
  outcome_column: seasonal_adjusted_log_return
  # Commodity and calendar-month fixed effects. The month effect is the point
  # of the design; without it this is just a pooled event study again.
  unit_fixed_effects: true
  time_fixed_effects: true
  index_definitions: [roni, oni]
  primary_index: roni
  primary_lag_months: 6
  reported_lag_months: [0, 3, 6, 9, 12]
  weighting_schemes: [exposure, uniform]
  primary_weighting: exposure
  minimum_observations: 2000
  # Estimation sample: registry mechanism candidates plus negative controls.
  # Excluded source series carry no exposure assignment and stay out.
  roles: [mechanism_candidate, negative_control]

inference:
  # Whole calendar years are resampled with replacement, and a year drawn twice
  # receives two separate sets of month effects, so a replicate stays one
  # coherent alternative history in the same sense as the episode bootstrap.
  block: calendar_year
  # Sensitivity only; the primary block above stays frozen. A calendar year is
  # shorter than the object being resampled -- an episode runs at least five
  # months and is read at lags of up to twelve, so a run of elevated regressor
  # exceeds twelve months and always straddles a January boundary. ENSO peaks in
  # NDJ, so that boundary cuts the peak of nearly every event. A block shorter
  # than the dependence understates the standard error, which is the direction
  # that flatters the result, so these variants can only widen the interval.
  # May starts the conventional ENSO year and keeps each NDJ peak whole.
  block_sensitivity:
    - name: enso_year
      start_month: 5
      length_years: 1
    - name: enso_two_year
      start_month: 5
      length_years: 2
    - name: enso_three_year
      start_month: 5
      length_years: 3
  bootstrap_replicates: 2000
  # Shuffle the same weights across candidate commodities in the primary cell.
  # Controls stay fixed at zero. This tests the mapping, not the weight scale.
  weight_permutation_replicates: 2000
  confidence_level: 0.95
  fdr_alpha: 0.05
  random_seed: 20260905
  demeaning_tolerance: 1.0e-9
  demeaning_max_iterations: 400

exposure_weights_file: external_exposure_weights.csv
excluded_candidates:
  - "Beef **"
  - "Chicken **"
  - "Coal, Australian"
  - "DAP"
  - "Fish meal"
  - "Lamb **"
  - "Logs, Malaysian"
  - "Natural gas, Europe"
  - "Natural gas, US"
  - "Shrimps, Mexican"
  - "Urea"

negative_control_weight: 0.0
