name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run python -m pytest --cov=enso_commodities --cov-report=term-missing --cov-fail-under=50

      - name: Verify published receipts, scorecard and figures
        if: matrix.python-version == '3.13'
        run: uv run enso-publication --check --bundle reports/artifacts/2026-09-06

      - name: Verify current-results report
        if: matrix.python-version == '3.13'
        run: uv run enso-report --check --published-bundle reports/artifacts/2026-09-06

      - name: Smoke-test installed CLI
        run: |
          uv run enso-panel --help
          uv run enso-power --help

      - name: Run lint
        if: matrix.python-version == '3.13'
        run: uv run python -m ruff check src tests scripts

      - name: Run type checks
        if: matrix.python-version == '3.13'
        run: uv run python -m mypy src
